<div class="app-layout">
    <div class="sidebar">
        <div class="logo-container">
            <img src="xentra.png" alt="Xentra Logo" class="logo">
        </div>
        
        <nav class="sidebar-nav">
            <div class="nav-section">
                <ul class="nav-menu">
                    <li *ngFor="let item of menuItems">
                        <app-sidebar-item
                            [label]="item.label"
                            [icon]="item.icon"
                            [route]="item.route"
                            [badge]="item.badge"
                        ></app-sidebar-item>
                    </li>
                </ul>
            </div>
        </nav>
        
        <div class="user-profile">
            <div class="profile-avatar">JG</div>
            <div class="profile-info">
                <h4>HR-Admin</h4>
                <p>jewro@gmail.com</p>
            </div>
        </div>
    </div>
</div>


<!-- SCENARIO
 
1. Create component (ng g c your-component-name)
2. Import the component to app.route.ts and then add the path to the routes array: { path: 'your-path', component: YourComponent }
3. In the component TypeScript file, make sure to include the constructor with the Router dependency: "constructor(private router: Router) {}"

Note: sa sidebar component and app ts lang may router outlet. Add mo lang lagi sa children yung components mo.
