<div class="app-layout">
    <div class="sidebar">
        <div class="logo-container">
            <img src="xentra.png" alt="Xentra Logo" class="logo">
        </div>
        
        <div class="nav-menu">
            <ul>
                <li><a routerLink="/dashboard" routerLinkActive="active" class="nav-link dashboard">Dashboard</a></li>
                <li><a routerLink="/employees" routerLinkActive="active" class="nav-link employees">Employees</a></li>
                <li><a routerLink="/projects" routerLinkActive="active" class="nav-link projects">Projects</a></li>
                <li><a routerLink="/request" routerLinkActive="active" class="nav-link request">Request</a></li>
                <li><a routerLink="/onboarding" routerLinkActive="active" class="nav-link onboarding">Onboarding</a></li>
                <li><a routerLink="/performance" routerLinkActive="active" class="nav-link performance">Performance</a></li>
                <li><a routerLink="/reports" routerLinkActive="active" class="nav-link reports">Reports</a></li>
                <li><a routerLink="/notifications" routerLinkActive="active" class="nav-link notifications">Notifications<span class="badge">3</span></a></li>
                <li><a routerLink="/settings" routerLinkActive="active" class="nav-link settings">Settings</a></li>
            </ul>
        </div>
        
        <div class="user-profile">
            <div class="profile-avatar">{{ user()?.initials ?? '' }}</div>
            <div class="profile-info">
                <h4>{{ user()?.role ?? '' }}</h4>
                <p [title]="user()?.email ?? ''">{{ user()?.email ?? '' }}</p>
            </div>
            <button type="button" class="logout-btn" title="Sign out" (click)="openLogoutConfirm()">
                <img src="/logout-box-r-line.svg" alt="Sign out" width="20" height="20">
            </button>
        </div>
    </div>
</div>

@if (showLogoutConfirm()) {
    <div class="logout-modal-backdrop" (click)="cancelLogout()">
        <div class="logout-modal" role="dialog" aria-modal="true" aria-labelledby="logout-title" (click)="$event.stopPropagation()">
            <h3 id="logout-title" class="logout-modal__title">Confirm Logout</h3>
            <p class="logout-modal__body">Are you sure you want to logout?</p>
            <div class="logout-modal__actions">
                <button type="button" class="logout-modal__btn logout-modal__btn--cancel" (click)="cancelLogout()">Cancel</button>
                <button type="button" class="logout-modal__btn logout-modal__btn--danger" (click)="confirmLogout()">Logout</button>
            </div>
        </div>
    </div>
}


<!-- SCENARIO
 
1. Create component (ng g c your-component-name)
2. Import the component to app.route.ts and then add the path to the routes array: { path: 'your-path', component: YourComponent }
3. In the component TypeScript file, make sure to include the constructor with the Router dependency: "constructor(private router: Router) {}"

Note: sa sidebar component and app ts lang may router outlet. Add mo lang lagi sa children yung components mo.


-->
