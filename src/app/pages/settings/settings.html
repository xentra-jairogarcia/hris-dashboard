<div class="settings-page">
    <h1 class="page-title">Settings</h1>

    <div class="settings-card">
        <!-- Profile Tab -->
        <div class="settings-tabs">
            <button class="tab active">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <circle cx="8" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/>
                    <path d="M2.5 14.5C3 11.5 5.2 9.5 8 9.5s5 2 5.5 5" fill="none" stroke="currentColor" stroke-width="1.4"/>
                </svg>
                Profile
            </button>
        </div>

        <!-- Personal Information -->
        <div class="settings-content">
            <h3 class="section-title">Personal Information</h3>

            <div class="avatar-section">
                <div class="avatar">{{ profile.initials }}</div>
                <div class="avatar-actions">
                    <button class="change-photo-btn">Change Photo</button>
                    <span class="photo-hint">JPG or PNG</span>
                </div>
            </div>

            <form class="profile-form" (ngSubmit)="saveChanges()">
                <div class="form-row two-columns">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" placeholder="Input Value" [(ngModel)]="profile.firstName" name="firstName">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Input Value" [(ngModel)]="profile.lastName" name="lastName">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Input Value" [(ngModel)]="profile.email" name="email">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Input Value" [(ngModel)]="profile.phone" name="phone">
                </div>

                <div class="form-group">
                    <label for="jobTitle">Job Title</label>
                    <input type="text" id="jobTitle" placeholder="Input Value" [(ngModel)]="profile.jobTitle" name="jobTitle">
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" placeholder="Input Value" [(ngModel)]="profile.department" name="department">
                </div>

                <div class="form-actions">
                    <button type="submit" class="save-btn">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12.5 14H3.5a1 1 0 01-1-1V3a1 1 0 011-1h7l3 3v8a1 1 0 01-1 1z"/>
                            <path d="M11.5 14V9.5h-7V14"/>
                            <path d="M4.5 2v3h5"/>
                        </svg>
                        Save Changes
                    </button>
                    <button type="button" class="cancel-btn" (click)="cancel()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>
