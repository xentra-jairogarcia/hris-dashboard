<div class="settings-page">
    <h1 class="page-title">Settings</h1>

    <div class="settings-card">
        <!-- Profile Tab -->
        <div class="settings-tabs">
            <app-tab-button label="Profile" [active]="true"></app-tab-button>
        </div>

        <!-- Personal Information -->
        <div class="settings-content">
            <h3 class="section-title">Personal Information</h3>

            <div class="avatar-section">
                <div class="avatar">{{ profile.initials }}</div>
                <div class="avatar-actions">
                    <app-action-button label="Change Photo" variant="primary" size="small"></app-action-button>
                    <span class="photo-hint">JPG or PNG</span>
                </div>
            </div>

            <form class="profile-form" (ngSubmit)="saveChanges()">
                <div class="form-row two-columns">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" placeholder="Input Value" [(ngModel)]="profile.firstName" name="firstName">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Input Value" [(ngModel)]="profile.lastName" name="lastName">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Input Value" [(ngModel)]="profile.email" name="email">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Input Value" [(ngModel)]="profile.phone" name="phone">
                </div>

                <div class="form-group">
                    <label for="jobTitle">Job Title</label>
                    <input type="text" id="jobTitle" placeholder="Input Value" [(ngModel)]="profile.jobTitle" name="jobTitle">
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" placeholder="Input Value" [(ngModel)]="profile.department" name="department">
                </div>

                <div class="form-actions">
                    <app-action-button label="Save Changes" variant="primary" size="small" icon="save" type="submit"></app-action-button>
                    <app-action-button label="Cancel" variant="secondary" size="medium" (clicked)="cancel()"></app-action-button>
                </div>
            </form>
        </div>
    </div>
</div>
