<div class="request-page">

    <!-- Header -->
    <div class="header">
        <h1>Request Management</h1>

        <app-action-button label="New Request" variant="primary" size="large" icon="plus"></app-action-button>
    </div>

    <!-- Card -->
    <div class="card">
        <!-- Tabs -->
        <div class="tabs">
            <app-tab-button label="All" [active]="true"></app-tab-button>
            <app-tab-button label="New Request" [active]="false"></app-tab-button>
            <app-tab-button label="Approved" [active]="false"></app-tab-button>
            <app-tab-button label="Rejected" [active]="false"></app-tab-button>
        </div>

        <!-- Table -->
        <table>

        <thead>
            <tr>
            <th>REQUEST ID</th>
            <th>EMPLOYEE</th>
            <th>TYPE</th>
            <th>DATE</th>
            <th>STATUS</th>
            <th>ACTION</th>
            </tr>
        </thead>

        <tbody>

            <tr>
            <td>REQ001</td>
            <td>Juan Dela Cruz</td>
            <td>Leave</td>
            <td>2026-01-15</td>
            <td><span class="status approved">Approved</span></td>
            <td class="action">
                <a routerLink="/request/REQ001">
                    <app-view-details-link label="View Details"></app-view-details-link>
                </a>
            </td>
            </tr>

            <tr>
            <td>REQ002</td>
            <td>Gwyneth Espinoza</td>
            <td>COE</td>
            <td>2026-01-14</td>
            <td><span class="status pending">Pending</span></td>
            <td class="action">
                <a routerLink="/request/REQ002">
                    <app-view-details-link label="View Details"></app-view-details-link>
                </a>
            </td>
            </tr>

            <tr>
            <td>REQ003</td>
            <td>LeBron James</td>
            <td>ABC</td>
            <td>2026-01-14</td>
            <td><span class="status approved">Approved</span></td>
            <td class="action">
                <a routerLink="/request/REQ003">
                    <app-view-details-link label="View Details"></app-view-details-link>
                </a>
            </td>
            </tr>

            <tr>
            <td>REQ004</td>
            <td>Kyrie Irving</td>
            <td>DEF</td>
            <td>2026-01-13</td>
            <td><span class="status rejected">Rejected</span></td>
            <td class="action">
                <a routerLink="/request/REQ004">
                    <app-view-details-link label="View Details"></app-view-details-link>
                </a>
            </td>
            </tr>

        </tbody>

        </table>

    </div>

</div>
