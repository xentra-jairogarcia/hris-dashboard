<div class="request-page">

    <!-- Header -->
    <div class="header">
        <h1>Request Management</h1>

        <app-action-button label="New Request" variant="primary" size="large" icon="plus"></app-action-button>
    </div>

    <!-- Card -->
    <div class="card">
        <!-- Tabs -->
        <div class="tabs">
            <app-tab-button label="All" [active]="true"></app-tab-button>
            <app-tab-button label="New Request" [active]="false"></app-tab-button>
            <app-tab-button label="Approved" [active]="false"></app-tab-button>
            <app-tab-button label="Rejected" [active]="false"></app-tab-button>
        </div>

        <!-- Table -->
        <table>

        <thead>
            <tr>
            <th>REQUEST ID</th>
            <th>EMPLOYEE</th>
            <th>TYPE</th>
            <th>DATE</th>
            <th>STATUS</th>
            <th>ACTION</th>
            </tr>
        </thead>

        <tbody>
            @for (req of requests; track req.id) {
            <tr>
            <td>{{ req.id }}</td>
            <td>{{ req.employee }}</td>
            <td>{{ req.type }}</td>
            <td>{{ req.date }}</td>
            <td><span class="status" [ngClass]="getStatusClass(req.status)">{{ req.status }}</span></td>
            <td class="action">
                <a [routerLink]="'/request/' + req.id">
                    <app-text-link-button label="View Details" icon="eye"></app-text-link-button>
                </a>
            </td>
            </tr>
            }
        </tbody>

        </table>

    </div>

</div>
