<div class="performance-page">

    <!-- Header -->
    <div class="performance-header">
        <h1>Performance Reviews</h1>

        <div class="performance-tabs-top">
        <app-tab-button label="Performance" [active]="true" variant="pill"></app-tab-button>
        <app-tab-button label="Career" [active]="false" variant="pill"></app-tab-button>
        <app-tab-button label="Assets" [active]="false" variant="pill"></app-tab-button>
        </div>
    </div>

    <!-- Card -->
    <div class="performance-card">

        <!-- Tabs -->
        <div class="performance-tabs">
        <app-tab-button label="Active" [active]="false"></app-tab-button>
        <app-tab-button label="Completed" [active]="false"></app-tab-button>
        <app-tab-button label="Draft" [active]="true"></app-tab-button>
        </div>

        <!-- Table -->
        <table class="performance-table">
        <thead>
            <tr>
            <th>REVIEW ID</th>
            <th>EMPLOYEE</th>
            <th>TYPE</th>
            <th>PERIOD</th>
            <th>REVIEWER</th>
            <th>REVIEWER DATE</th>
            <th>STATUS</th>
            <th>ACTIONS</th>
            </tr>
        </thead>

        <tbody>
            @for (review of reviews; track review.id) {
            <tr>
            <td>{{ review.id }}</td>
            <td>{{ review.employee }}</td>
            <td>{{ review.type }}</td>
            <td>{{ review.period }}</td>
            <td>{{ review.reviewer }}</td>
            <td>{{ review.reviewerDate }}</td>
            <td><span class="badge" [ngClass]="getStatusClass(review.status)">{{ review.status }}</span></td>
            <td class="actions">
                <app-text-link-button label="View Details" icon="eye"></app-text-link-button>
            </td>
            </tr>
            }
        </tbody>
        </table>

    </div>

</div>
