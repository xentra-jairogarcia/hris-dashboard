<div class="performance-page">

    <!-- Header -->
    <div class="performance-header">
        <h1>Performance Reviews</h1>

        <div class="performance-tabs-top">
        <app-pill-tab-button label="Performance" [active]="true"></app-pill-tab-button>
        <app-pill-tab-button label="Career" [active]="false"></app-pill-tab-button>
        <app-pill-tab-button label="Assets" [active]="false"></app-pill-tab-button>
        </div>
    </div>

    <!-- Card -->
    <div class="performance-card">

        <!-- Tabs -->
        <div class="performance-tabs">
        <app-tab-button label="Active" [active]="false"></app-tab-button>
        <app-tab-button label="Completed" [active]="false"></app-tab-button>
        <app-tab-button label="Draft" [active]="true"></app-tab-button>
        </div>

        <!-- Table -->
        <table class="performance-table">
        <thead>
            <tr>
            <th>REVIEW ID</th>
            <th>EMPLOYEE</th>
            <th>TYPE</th>
            <th>PERIOD</th>
            <th>REVIEWER</th>
            <th>REVIEWER DATE</th>
            <th>STATUS</th>
            <th>ACTIONS</th>
            </tr>
        </thead>

        <tbody>
            <tr>
            <td>REV001</td>
            <td>Juan Dela Cruz</td>
            <td>Annual</td>
            <td>Q4 2025</td>
            <td>Steve Rogers</td>
            <td>2026-01-15</td>
            <td><span class="badge draft">Draft</span></td>
            <td class="actions">
                <app-view-details-link label="View Details"></app-view-details-link>
            </td>
            </tr>

            <tr>
            <td>REV002</td>
            <td>Gwyneth Espinoza</td>
            <td>Probation</td>
            <td>Q3 2025</td>
            <td>Bruce Banner</td>
            <td>2026-01-14</td>
            <td><span class="badge draft">Draft</span></td>
            <td class="actions">
                <app-view-details-link label="View Details"></app-view-details-link>
            </td>
            </tr>
        </tbody>
        </table>

    </div>

</div>
